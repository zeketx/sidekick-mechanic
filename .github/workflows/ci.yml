name: Linux CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: linux-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest

  sidekick-core:
    name: SidekickCore tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Official Swift 6.4.0 on Ubuntu 24.04. Matches Package.swift
    # (swift-tools-version 6.0; verified locally with Swift 6.4 in PR #51).
    container:
      image: swift:6.4.0-noble
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        working-directory: app/SidekickCore
        run: swift test

  eval-subset:
    name: Eval subset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fast fake-LLM slice. Separate from Backend tests, which stay required.
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fast eval subset
        run: python -m eval --golden eval/golden.sample.jsonl --ci --summary-file "$GITHUB_STEP_SUMMARY"
