name: SidekickMechanic
options:
  bundleIdPrefix: com.zeketx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  SidekickCore:
    path: SidekickCore
targets:
  SidekickMechanic:
    type: application
    platform: iOS
    sources:
      - path: SidekickMechanic
    dependencies:
      - package: SidekickCore
    info:
      path: SidekickMechanic/Info.plist
      properties:
        CFBundleDisplayName: Sidekick
        NSCameraUsageDescription: Sidekick uses the camera so you can add a photo of your truck.
        NSPhotoLibraryUsageDescription: Sidekick uses your photo library so you can add a photo of your truck.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        SidekickBackendURL: $(SIDEKICK_BACKEND_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeketx.SidekickMechanic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SIDEKICK_BACKEND_URL: "http://localhost:8000"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_STRICT_CONCURRENCY: complete
  SidekickMechanicUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SidekickMechanicUITests
    dependencies:
      - target: SidekickMechanic
      - package: SidekickCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeketx.SidekickMechanicUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SidekickMechanic
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_STYLE: Manual
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  SidekickMechanic:
    build:
      targets:
        SidekickMechanic: all
        SidekickMechanicUITests: [testing]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SidekickMechanicUITests
