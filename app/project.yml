name: SidekickMechanic
options:
  bundleIdPrefix: com.zeketx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  SidekickCore:
    path: SidekickCore
targets:
  SidekickMechanic:
    type: application
    platform: iOS
    sources:
      - path: SidekickMechanic
    dependencies:
      - package: SidekickCore
    info:
      path: SidekickMechanic/Info.plist
      properties:
        CFBundleDisplayName: Sidekick
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        SidekickBackendURL: $(SIDEKICK_BACKEND_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeketx.SidekickMechanic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SIDEKICK_BACKEND_URL: "http://localhost:8000"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
schemes:
  SidekickMechanic:
    build:
      targets:
        SidekickMechanic: all
    run:
      config: Debug
